# Shipped defaults. Do not edit for personal preferences: user overrides live in
# %LOCALAPPDATA%\ProjectJarvis\config\user.yaml and only record the difference
# from this file (ADR-0006).
#
# Every key here must exist in jarvis.config.schema. Unknown keys are a startup
# error, not a silently ignored value.

schema_version: 1

runtime:
  required_python: ">=3.11,<3.13"
  single_instance: true

network:
  # offline          - no network request is made by any component
  # local_assistant  - local model only; network tools available when invoked
  # connected        - optional configured search or cloud providers available
  mode: local_assistant

llm:
  ollama:
    base_url: "http://127.0.0.1:11434"
    request_timeout_seconds: 10.0
    health_check_interval_seconds: 300
    require_loopback: true

models:
  planner:
    provider: ollama
    name: qwen3.5:9b-q4_K_M
    context_length: 16384

  vision:
    provider: ollama
    name: qwen3-vl:8b-instruct-q4_K_M
    context_length: 8192

  embeddings:
    provider: ollama
    name: qwen3-embedding:0.6b
    context_length: 8192

model_runtime:
  idle_unload_seconds: 180
  load_strategy: sequential
  allow_parallel_heavy_models: false

audio:
  # Short tones for "wake phrase heard" and "working on it", so Jarvis is
  # legible from the tray without its window open.
  cues_enabled: true

  # always      - say every reply to a spoken request out loud
  # when_useful - answer questions and report problems aloud; mark a finished
  #               instruction ("open Brave") with a cue instead of narrating it
  # never       - never speak a reply; the Conversation screen still has it
  # A typed request is never answered aloud, whatever this says.
  speak_replies: when_useful

  # half - wake detection pauses while Jarvis speaks, so it cannot be
  #        interrupted by voice. FR-015 permits this for Phase 1, and user
  #        acceptance on 2026-08-04 found voice interruption did not work on
  #        this hardware, so claiming otherwise would be false (ADR-0028).
  # full  - the microphone stays live while speaking; needs the self-trigger
  #         rate measured before it can be relied upon.
  # Ctrl+Alt+End and the tray's "Stop speaking" work in either mode.
  duplex_mode: half

  wake_word:
    provider: openwakeword
    # ADR-0016 Path 1 layers a personal verifier on a pretrained base model, and
    # openWakeWord ships one for "Hey Jarvis" but not for bare "Jarvis". The GUI
    # must show the enrolled phrase truthfully and must never imply this model
    # detects "Jarvis" alone (FR-011).
    phrase: "Hey Jarvis"
    push_to_talk_enabled: true
    push_to_talk_hotkey: "F9"
    # Stays false until enrolment has been measured and passed (ADR-0016).
    always_listening: true
    enrolled: false

  speech_to_text:
    provider: faster_whisper
    model: small
    device: cpu
    compute_type: int8
    language: en
    vad_filter: true
    retain_raw_audio: false
    beam_size: 1
    preload_on_startup: true
    warmup_on_startup: true
    idle_unload_seconds: 0

  text_to_speech:
    active_profile: kokoro_bm_george

    profiles:
      kokoro_bm_george:
        provider: kokoro
        model_repository: hexgrad/Kokoro-82M
        python_runtime: "3.11"
        language_code: "b"
        spoken_language: English
        voice: bm_george
        device: cpu
        speed: 1.0
        sample_rate_hz: 24000
        enabled: true

      qwen3_tts_expressive:
        provider: qwen3_tts
        model_repository: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
        python_runtime: "3.12"
        execution_mode: isolated_worker
        spoken_language: English
        device: cuda
        enabled: false
        status: experimental

      windows_sapi:
        provider: windows_sapi
        spoken_language: English
        enabled: true
        fallback_only: true

  pronunciation:
    provider: espeak-ng
    architecture: x64
    installation_scope: Windows system
    status: to_be_verified

  language:
    recognition:
      mode: en
      preferred_languages:
        - en

    conversation:
      understand:
        - English

    response_language: English

    spoken_output:
      default_language: English

permissions:
  # Fallback decision when no grant matches, per risk level.
  # High risk is always "ask" and cannot be configured otherwise (PRD 11.1).
  default_policy:
    low: ask
    medium: ask
    high: ask
  session_grant_ttl_seconds: 3600
  allow_always_for_low_risk: true

tasks:
  max_concurrent: 2
  default_max_retries: 3
  lock_acquire_timeout_seconds: 0.0
  scheduler_poll_interval_seconds: 0.1
  step_timeout_seconds: 120.0

logging:
  level: INFO
  audit_to_sqlite: true
  max_audit_value_chars: 512

ui:
  start_minimised_to_tray: true
  show_unavailable_features: true
  # Not Pause: many compact and tenkeyless keyboards have no Pause key, which
  # leaves the panic button unreachable. End exists on every layout.
  emergency_stop_hotkey: "Ctrl+Alt+End"
  start_at_sign_in: false
  # What to call you. Set it on the Conversation screen; empty means "You".
  user_name: ""
  approval_timeout_seconds: 120.0

storage:
  huggingface_home: "%LOCALAPPDATA%\\ProjectJarvis\\models\\huggingface"
  application_data: "%LOCALAPPDATA%\\ProjectJarvis"
  workspace: "%USERPROFILE%\\Documents\\Jarvis Workspace"

privacy:
  raw_audio_retention: disabled
  generated_voice_retention: temporary
  screenshot_retention: task_only
  telemetry_enabled: false
