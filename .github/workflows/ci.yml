name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product target. Ubuntu runs too, because the engine
        # must stay importable and testable without Windows-only APIs
        # (ARCHITECTURE.md section 4.1) — a regression there means the layering
        # has been broken.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    env:
      # No test may touch a real user profile, and Qt has no display in CI.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest --cov --cov-report=term-missing

      - name: Verify the headless self-check starts
        run: python -m jarvis.main --check --data-dir "${{ runner.temp }}/jarvis-ci"

  security:
    name: Security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Run separately and first so a broken invariant is unmistakable in the
      # job list, not buried in a long test log (ADR-0003).
      - name: No generic execution capability, no elevation, correct layering
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/security -v

  dependencies:
    name: Dependency and licence review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit pip-licenses

      - name: Install the project
        run: python -m pip install -e .

      # PRD NFR-023. Advisory for now: this becomes blocking before the first
      # public build (docs/decisions/ADR-0026-code-signing-and-updates.md).
      - name: Known vulnerabilities
        continue-on-error: true
        run: pip-audit --strict

      - name: Licence inventory
        run: pip-licenses --format=markdown --with-urls
