[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-jarvis"
version = "0.1.0.dev0"
description = "Local-first Windows desktop AI agent (internal codename: Jarvis)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary — pre-release, not for redistribution" }
authors = [{ name = "Project Jarvis" }]
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:jarvis.*"]
markers = [
    "ui: requires Qt; runs under QT_QPA_PLATFORM=offscreen",
    "slow: takes more than a second",
]

[tool.coverage.run]
source = ["src/jarvis"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
