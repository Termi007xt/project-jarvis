[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-jarvis"
version = "0.2.0.dev0"
description = "Local-first Windows desktop AI agent (internal codename: Jarvis)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary — pre-release, not for redistribution" }
authors = [{ name = "Project Jarvis" }]
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# The voice stack is optional on purpose (decided 2026-08-02). Kokoro and
# faster-whisper pull in torch and onnxruntime, and CI runs on Linux with no
# microphone or GPU. Every provider imports these lazily, so the engine still
# imports without them and reports an honest unavailable state instead
# (ADR-0010, NFR-014). Versions match the spikes verified on hardware in
# tools/voice-lab/.
voice = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "faster-whisper>=1.2",
    "kokoro>=0.9.4",
    "openwakeword>=0.6",
]
# Phase 2 desktop and browser automation. Optional for the same reasons the
# voice extra is: CI runs on Linux with no desktop and no browser, and the
# engine must still import and report an honest unavailable state without these
# (ADR-0010, NFR-014). Every provider imports them lazily.
#
# Playwright is a *client* here, never a launcher — Brave is started through the
# single authorised call site in jarvis.toolbox.launch and Playwright attaches
# over CDP (ADR-0029, ADR-0031). Installing it does not install a browser, and
# `playwright install` is deliberately not run: the product drives the user's
# real Brave, not a bundled Chromium.
#
# pywinauto is Windows-only by nature; the marker keeps `pip install -e
# ".[automation]"` working on the Linux CI runner that enforces the layering.
automation = [
    "playwright>=1.49",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:jarvis.*"]
markers = [
    "ui: requires Qt; runs under QT_QPA_PLATFORM=offscreen",
    "slow: takes more than a second",
]

[tool.coverage.run]
source = ["src/jarvis"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
